services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: online_shop
      POSTGRES_USER: online_shop
      POSTGRES_PASSWORD: local-password

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U online_shop -d online_shop"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped

    command: ["redis-server", "--appendonly", "yes"]

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    command: >
      sh -c "
      python manage.py migrate --noinput &&
      gunicorn book_store.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --timeout 60
      --access-logfile -
      --error-logfile -
      "

    environment:
      DEBUG: "False"
      SECRET_KEY: "django-insecure-local-docker-key"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      CSRF_TRUSTED_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"
      DATABASE_URL: "postgresql://online_shop:local-password@db:5432/online_shop"
      REDIS_URL: "redis://redis:6379/1"

    ports:
      - "8000:8000"

    volumes:
      - media_data:/app/media

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_data: